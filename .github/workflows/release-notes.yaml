name: Generate Release Notes

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (e.g., Preprod, Preview)'
        required: false
        default: 'Preprod, Preview'

permissions:
  contents: write

jobs:
  generate-release-notes:
    name: Generate and update release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Generate release notes
        run: |
          node scripts/generate-release-notes.mjs --env "${{ inputs.environment || 'Preprod, Preview' }}"
      - name: Update GitHub Release with generated notes
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ github.event.release.prerelease }}

      - name: Commit release notes
        if: github.event_name == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RELEASE_NOTES.md
          git commit -m "docs: update release notes for ${{ github.event.release.tag_name }}"
          git push origin HEAD:main

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
